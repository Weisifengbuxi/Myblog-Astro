# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
# =============================================================================
# Site Configuration
# =============================================================================
# This file contains all site-specific configurations.
# Modify this file to customize your blog.
# After changes, rebuild the site: docker compose up -d --build
# =============================================================================

# =============================================================================
# Site Basic Information
# =============================================================================
site:
  title: 未似风不息 # 网站名称
  alternate: Weisifengbuxi # 网站英文名称 用于页脚、Logo、@ handle 等
  subtitle: 学习技术 分享生活 # 网站副标题
  name: 未似风不息 # 作者名称
  description: 未似风不息的个人技术博客，分享计算机组成原理、数据结构与算法、数学建模等学习笔记，以及生活感悟与博客搭建教程。 # 网站描述
  avatar: /img/avatar.jpg # 网站头像
  showLogo: false # false = 页头显示站点名称文字（alternate）；true = 显示 src/assets/svg/logo.svg（主题作者的 Cosine logo，需自行替换）
  author: 未似风不息 # 作者名称
  url: https://www.weisifengbuxi.top # 站点 URL 用于 RSS 和 SEO
  defaultOgImage: /img/avatar.jpg # 默认 Open Graph 图片
  startYear: 2025 # 建站年份
  timezone: Asia/Shanghai # 时区配置 (IANA 格式)
  keywords: # SEO 关键词 (全局)
    - 博客
    - 学习笔记
    - 计算机组成原理
    - 数据结构
    - 算法
    - 数学建模
    - AStro
    - 个人博客
  # breadcrumbHome: 首页  # 面包屑导航中首页的显示名称（默认: '首页'）
  icp: # ICP 备案号（主题原生字段，显示在页脚版权行下方）
    text: '晋ICP备-2025067606号'
    link: 'https://beian.miit.gov.cn/'
  # Enable slug transliteration (converts CJK characters to pinyin/romaji)
  # Note: enabling this will break existing CJK URLs. Run `pnpm save-slugs` first to save old slugs into frontmatter.link
  # enableSlugTransliteration: true
# =============================================================================
# Internationalization (i18n)
# 国际化配置 - 控制多语言支持
# =============================================================================
# defaultLocale: 默认语言代码（URL 不带前缀）
# locales: 支持的语言列表
#   - code: 语言代码（BCP 47 短格式，如 'zh', 'en', 'ja'）
#   - label: 语言显示名称（如 '中文', 'English'）
# -----------------------------------------------------------------------------
i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文
    # 多语言支持已关闭：内容与 UI 翻译尚未提供。
    # 注意：astro.config.mjs 依据本列表是否有多于一种语言来决定是否生成
    # /en、/ja 等带前缀的路由，因此这里必须只保留一种语言；
    # 否则站点会生成 /en/post/... 之类的空路由，并可能被搜索引擎判为重复内容。
    # 如需启用英文站点：
    #   1. 在 src/i18n/translations/ 下新增 <code>.ts 并在 index.ts 注册
    #   2. 将翻译文章放入 src/content/blog/<code>/
    #   3. 在下方重新加入对应的 code
# =============================================================================
# Category Map
# Maps Chinese category names to URL-friendly English slugs
# Example: '随笔' category URL becomes /categories/life
# =============================================================================
categoryMap:
  # 分类名 -> URL 段（只能是「一段」路径，不能写成 a/b）。
  # astro-koharu 的层级来自文章 frontmatter 里的分类名数组，
  # 例如 categories: [[学习笔记, 代码学习]] 会依次映射成
  # /categories/note 与 /categories/note/code —— 父级前缀由主题自动拼接，
  # 所以这里的值千万不要再写成 "note/code"，否则会变成 note/note/code。
  #
  # 一级分类
  生活日常: life
  学习笔记: note
  工具: tools
  # 学习笔记的二级分类
  代码学习: code
  理论学习: theory
  排序: algorithm
  比赛: contest
  美化: beautify
  数学建模: modeling
  # 前端分类，保留以备后续使用 -> /categories/note/front-end
  前端: front-end
  # 其他
  教程: tools
  福利: tools
  # 可按需继续添加（不要在值里写斜杠）：
  # 书摘: reading
  # 项目: project
# =============================================================================
# Featured Categories (Homepage)
# 首页精选分类 - 在首页以卡片形式展示的分类入口
# =============================================================================
# 字段说明：
#   link: 分类链接路径，对应 categoryMap 中的英文 slug
#   label: 卡片上显示的分类名称
#   image: 封面图片路径（相对于 public 目录）
#   description: 分类描述文字，显示在卡片上
# -----------------------------------------------------------------------------
featuredCategories:
  - link: note
    label: 学习笔记
    image: /img/cover/4.webp
    description: 计算机组成原理、数据结构与算法等课程笔记
  - link: note/code
    label: 代码学习
    image: /img/cover/1.webp
    description: Java 数据结构、链表栈队列与递归
  - link: note/theory
    label: 理论学习
    image: /img/cover/7.webp
    description: 逻辑门电路、计算机组成原理等理论笔记
  - link: tools
    label: 工具
    image: /img/cover/11.webp
    description: 博客美化、CDN 加速与效率工具
  - link: life
    label: 生活日常
    image: /img/cover/2.webp
    description: 生活记录、随想与见闻
# =============================================================================
# Featured Series
# 精选系列功能 - 用于展示定期更新的系列内容（支持多个系列）
# =============================================================================
# 字段说明：
#   slug: URL 路径（必填），如 'weekly' 对应 /weekly 路径
#         注意：不能与保留路由冲突，包括：about, categories, tags, friends, posts, archives, api, _astro, rss.xml, sitemap.xml, robots.txt, favicon.ico 等
#   categoryName: 对应的分类名称（必填，需在 categoryMap 中存在）
#   label: 侧边栏/导航中显示的简短名称（可选）
#   fullName: 系列页面标题显示的完整名称（可选）
#   description: 系列介绍文字，支持多行 Markdown（可选）
#   cover: 系列页面头图路径，相对于 public 目录（可选）
#   enabled: 是否启用此系列，设为 false 可关闭（可选，默认 true）
#   icon: 导航图标，Iconify 格式如 'ri:newspaper-line'（可选）
#   highlightOnHome: 是否在首页高亮显示最新文章（可选，默认 true，显式设为 false 可禁用）
#   links: 相关链接配置（可选）
# -----------------------------------------------------------------------------
featuredSeries:
  # 暂未启用系列文章功能。
  # 如需启用，取消下面的注释并按需修改（slug 不能与 about/categories/tags/friends/posts/archives 等保留路由冲突）：
  - slug: weekly
    categoryName: 学习笔记
    label: 我的周刊
    fullName: 我的技术周刊
    description: |
      这是周刊/系列文章功能的示例配置。
    cover: /img/weekly_header.webp
    enabled: false
    icon: ri:newspaper-line
