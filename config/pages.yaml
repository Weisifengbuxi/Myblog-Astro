          link: https://item.lenovo.com.cn/product/1046448.html
        - name: HUAWEI MatePad Pro
          specification: 曜金黑 / 256G
          description: 事事玩得转，就是皮套模式的判定很奇怪
          image: https://s21.ax1x.com/2025/08/23/pVDj2Sf.jpg
          link: https://www.vmall.com/product/comdetail/index.html?prdId=10086139444943
        - name: HUAWEI nova 14 Ultra
          specification: 曜金黑 / 256G
          description: 6.81 英寸 1.5K 分辨率 OLED 全等深微曲屏，支持 1-120Hz LTPO 3.0 自适应刷新率，动态画面流畅显示，以及 5500mAh 电池无敌续航
          image: https://s21.ax1x.com/2025/08/23/pVDjW6S.jpg
          link: https://consumer.huawei.com/cn/phones/nova14-ultra/specs/
        - name: HUAWEI FreeBuds 5
